name: Trigger auto deployment for lucrarea1pssc-app-20260102173218

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/lucrarea1pssc-app-20260102173218-AutoDeployTrigger-4e328e06-f91e-460d-8325-d9cb2689a091.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:

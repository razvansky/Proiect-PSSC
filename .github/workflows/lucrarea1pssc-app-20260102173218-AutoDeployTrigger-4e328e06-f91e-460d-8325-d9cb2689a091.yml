      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.LUCRAREA1PSSCAPP20260102173218_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LUCRAREA1PSSCAPP20260102173218_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LUCRAREA1PSSCAPP20260102173218_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: lucrarea1pssc20260102173626.azurecr.io
          registryUsername: ${{ secrets.LUCRAREA1PSSCAPP20260102173218_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.LUCRAREA1PSSCAPP20260102173218_REGISTRY_PASSWORD }}
          containerAppName: lucrarea1pssc-app-20260102173218
          resourceGroup: NetworkWatcherRG
          imageToBuild: lucrarea1pssc20260102173626.azurecr.io/lucrarea1pssc-app-20260102173218:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


